name: Temporary offroad rumble patch

on:
  push:
    branches:
      - test-offroad-rumble-continuous

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-offroad-rumble-continuous
          fetch-depth: 0

      - name: Apply exact offroad FFB patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/engine/ooutputs.cpp')
          text = path.read_text(encoding='utf-8')

          old_table = '''    const uint8_t* table =
              (oferrari.wheel_state != OFerrari::WHEELS_OFF)
              ? MOTOR_VALUES_OFFROAD2
              : MOTOR_VALUES_OFFROAD1;
          '''
          old_table = old_table.replace('              (', '        (').replace('              ?', '        ?').replace('              :', '        :')

          new_table = '''    // For FFB, keep the denser vibration pattern even when all wheels
              // are off-road. Cabinet/non-FFB modes retain the original table choice.
              const uint8_t* table =
                  (mode == MODE_FFEEDBACK ||
                   oferrari.wheel_state != OFerrari::WHEELS_OFF)
                  ? MOTOR_VALUES_OFFROAD2
                  : MOTOR_VALUES_OFFROAD1;
          '''
          new_table = new_table.replace('              // are', '    // are').replace('              const', '    const').replace('                  (', '        (').replace('                   oferrari', '         oferrari').replace('                  ?', '        ?').replace('                  :', '        :')

          old_strength = '''    // Reduce existing off-road vibration to 35%.
              rumble_force =
                  (rumble_force * 35) / 100;
          '''
          old_strength = old_strength.replace('              rumble_force', '    rumble_force').replace('                  (rumble', '        (rumble')

          new_strength = '''    // Reduce existing off-road vibration to 50%.
              rumble_force =
                  (rumble_force * 50) / 100;
          '''
          new_strength = new_strength.replace('              rumble_force', '    rumble_force').replace('                  (rumble', '        (rumble')

          if text.count(old_table) != 1:
              raise SystemExit(f'Expected table block once, found {text.count(old_table)}')
          if text.count(old_strength) != 1:
              raise SystemExit(f'Expected strength block once, found {text.count(old_strength)}')

          text = text.replace(old_table, new_table)
          text = text.replace(old_strength, new_strength)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched source and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-offroad-rumble.yml
          git config user.name "Endprodukt"
          git config user.email "o.carell@kabelmail.de"
          git add src/main/engine/ooutputs.cpp .github/workflows/temp-offroad-rumble.yml
          git commit -m "Keep off-road rumble active and set it to 50 percent"
          git push origin HEAD:test-offroad-rumble-continuous
