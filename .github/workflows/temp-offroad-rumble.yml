name: Temporary offroad rumble cleanup

on:
  push:
    branches:
      - test-offroad-rumble-continuous

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-offroad-rumble-continuous
          fetch-depth: 0

      - name: Restore unintended coin chute changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/engine/ooutputs.cpp')
          text = path.read_text(encoding='utf-8')

          bad = '''void OOutputs::coin_chute_out(CoinChute* chute, bool insert)
          {
              // Initalize counter if coin inserted
              chute1.counter[2] = insert ? 1 : 0;

              if (chute1.counter[0])
              {
                  if (--chute1.counter[0] != 0)
                      return;
                  chute1.counter[1] = 6;
                  clear_digital(chute1.output_bit);
              }
              else if (chute1.counter[1])
              {
                  chute1.counter[1]--;
              }
              // Coin first inserted. Called Once. 
              else if (chute1.counter[2])
              {
                  chute1.counter[2]--;
                  chute1.counter[0] = 6;
                  set_digital(chute1.output_bit);
              }
          }'''
          bad = bad.replace('          {', '{').replace('              // Initalize', '    // Initalize').replace('              chute1', '    chute1').replace('              if', '    if').replace('              {', '    {').replace('                  if', '        if').replace('                      return', '            return').replace('                  chute1', '        chute1').replace('                  clear', '        clear').replace('              }', '    }').replace('              else', '    else').replace('                  set', '        set')

          good = '''void OOutputs::coin_chute_out(CoinChute* chute, bool insert)
          {
              // Initalize counter if coin inserted
              chute->counter[2] = insert ? 1 : 0;

              if (chute->counter[0])
              {
                  if (--chute->counter[0] != 0)
                      return;
                  chute->counter[1] = 6;
                  clear_digital(chute->output_bit);
              }
              else if (chute->counter[1])
              {
                  chute->counter[1]--;
              }
              // Coin first inserted. Called Once. 
              else if (chute->counter[2])
              {
                  chute->counter[2]--;
                  chute->counter[0] = 6;
                  set_digital(chute->output_bit);
              }
          }'''
          good = good.replace('          {', '{').replace('              // Initalize', '    // Initalize').replace('              chute->', '    chute->').replace('              if', '    if').replace('              {', '    {').replace('                  if', '        if').replace('                      return', '            return').replace('                  chute->', '        chute->').replace('                  clear', '        clear').replace('              }', '    }').replace('              else', '    else').replace('                  set', '        set')

          if text.count(bad) != 1:
              raise SystemExit(f'Expected bad coin block once, found {text.count(bad)}')

          if '(rumble_force * 50) / 100;' not in text:
              raise SystemExit('50 percent rumble change missing')
          if 'mode == MODE_FFEEDBACK ||' not in text:
              raise SystemExit('continuous FFB table selection change missing')

          text = text.replace(bad, good)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-offroad-rumble.yml
          git config user.name "Endprodukt"
          git config user.email "o.carell@kabelmail.de"
          git add src/main/engine/ooutputs.cpp .github/workflows/temp-offroad-rumble.yml
          git commit -m "Clean up off-road rumble test patch"
          git push origin HEAD:test-offroad-rumble-continuous
